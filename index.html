<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d1017">
<title>桌游集合</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2032%2032'%3E%3Crect%20width='32'%20height='32'%20rx='7'%20fill='%230d1017'/%3E%3Crect%20x='6'%20y='8'%20width='12'%20height='16'%20rx='2'%20fill='%23e0533f'/%3E%3Crect%20x='14'%20y='8'%20width='12'%20height='16'%20rx='2'%20fill='%233f7fe0'%20opacity='.85'/%3E%3C/svg%3E">
<style>
:root {
  --bg: #0d1017;
  --panel: rgba(255, 255, 255, .05);
  --line: rgba(255, 255, 255, .09);
  --text: #eef1f6;
  --muted: rgba(190, 200, 216, .62);
  --gold: #f2b53a;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; min-height: 100%; }
body {
  background:
    radial-gradient(120% 60% at 50% 0%, rgba(224, 83, 63, .12), transparent 55%),
    radial-gradient(90% 50% at 80% 100%, rgba(63, 127, 224, .12), transparent 60%),
    var(--bg);
  color: var(--text);
  font-family: -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif;
  user-select: none;
  -webkit-user-select: none;
}
.wrap { max-width: 520px; margin: 0 auto; padding: 48px 20px 60px; }
header h1 {
  margin: 0;
  font-size: 34px;
  letter-spacing: .06em;
}
header .sub { margin: 8px 0 0; font-size: 12px; letter-spacing: .3em; color: var(--muted); }
header .divider {
  margin: 20px 0 26px;
  height: 1px;
  background: linear-gradient(90deg, transparent, rgba(242, 181, 58, .5), transparent);
}
.grid { display: flex; flex-direction: column; gap: 14px; }
.game-card {
  display: block;
  text-decoration: none;
  color: inherit;
  border: 1px solid var(--line);
  border-radius: 18px;
  background: var(--panel);
  overflow: hidden;
  transition: transform .15s, border-color .15s;
}
.game-card:active { transform: scale(.98); }
.gc-art {
  height: 120px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 40px;
  font-weight: 900;
  font-style: italic;
  letter-spacing: -1px;
}
.gc-art.uno {
  background:
    radial-gradient(80% 120% at 20% 10%, rgba(224, 83, 63, .5), transparent 60%),
    radial-gradient(80% 120% at 85% 90%, rgba(63, 127, 224, .45), transparent 60%),
    #171c28;
  color: #fff;
  text-shadow: 0 4px 14px rgba(0, 0, 0, .5);
}
.gc-art.citadels {
  background:
    radial-gradient(80% 120% at 20% 10%, rgba(216, 177, 102, .35), transparent 60%),
    radial-gradient(80% 120% at 85% 90%, rgba(90, 70, 140, .4), transparent 60%),
    #171c28;
  color: var(--gold);
  font-style: normal;
  font-size: 30px;
  letter-spacing: .1em;
}
.gc-body { padding: 14px 16px 16px; }
.gc-name { font-size: 18px; font-weight: 700; letter-spacing: .06em; display: flex; align-items: center; gap: 8px; }
.gc-tag { margin: 6px 0 0; font-size: 12px; line-height: 1.7; color: var(--muted); }
.gc-meta { margin-top: 10px; display: flex; gap: 6px; flex-wrap: wrap; }
.gc-chip {
  font-size: 10px;
  color: var(--muted);
  border: 1px solid var(--line);
  border-radius: 99px;
  padding: 2px 9px;
}
footer { margin-top: 30px; text-align: center; font-size: 10px; letter-spacing: .2em; color: rgba(190, 200, 216, .35); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>桌游集合</h1>
    <p class="sub">GAME HUB</p>
    <div class="divider"></div>
  </header>

  <div class="grid" id="game-grid"></div>

  <footer>纯本地 · 无需联网 · 局域网联机</footer>
</div>

<script>
/* 新增桌游：往这个数组里加一项即可 */
var GAMES = [
  {
    id: 'uno',
    name: 'UNO',
    tagline: '经典 UNO。跟颜色、跟数字、放功能牌，最先出完手牌的人赢，喊 UNO 的快乐一个不少。',
    chips: ['2–4 人', '局域网联机', '支持 AI 补位'],
    url: 'uno/',
    art: 'uno',
    artText: 'UNO'
  },
  {
    id: 'citadels',
    name: '富饶之城',
    tagline: '八位角色，五色城区。猜透对手，建成最富饶的王城。',
    chips: ['2–4 人', '局域网联机', '角色扮演'],
    url: '../citadels/',
    art: 'citadels',
    artText: '富饶之城'
  }
];

document.getElementById('game-grid').innerHTML = GAMES.map(function (gm) {
  return '<a class="game-card" href="' + gm.url + '">' +
    '<div class="gc-art ' + gm.art + '">' + gm.artText + '</div>' +
    '<div class="gc-body">' +
    '<div class="gc-name">' + gm.name + '</div>' +
    '<p class="gc-tag">' + gm.tagline + '</p>' +
    '<div class="gc-meta">' + gm.chips.map(function (c) { return '<span class="gc-chip">' + c + '</span>'; }).join('') + '</div>' +
    '</div></a>';
}).join('');
</script>
</body>
</html>
